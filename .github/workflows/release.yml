name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build archives and .deb packages
        env:
          LICGATE_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/package.sh "${GITHUB_REF_NAME}"
      - name: Check licgate's own dependencies
        run: |
          sudo dpkg -i dist/licgate_*_amd64.deb
          licgate --no-tui -l MIT
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
